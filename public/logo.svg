<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff" />
      <stop offset="100%" stop-color="#ff6b9d" />
    </linearGradient>

    <linearGradient id="lensGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#7c5cff" />
    </linearGradient>

    <filter id="logoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect
    x="4"
    y="10"
    width="32"
    height="22"
    rx="3"
    stroke="url(#logoGradient)"
    stroke-width="1.5"
    fill="none"
  />

  <circle cx="12" cy="10" r="3.5" stroke="url(#logoGradient)" stroke-width="1.5" fill="none" />
  <circle cx="12" cy="10" r="1.2" fill="url(#logoGradient)" />

  <circle cx="28" cy="10" r="3.5" stroke="url(#logoGradient)" stroke-width="1.5" fill="none" />
  <circle cx="28" cy="10" r="1.2" fill="url(#logoGradient)" />

  <circle
    cx="20"
    cy="21"
    r="7"
    stroke="url(#lensGradient)"
    stroke-width="1.5"
    fill="none"
    filter="url(#logoGlow)"
  />

  <circle
    cx="20"
    cy="21"
    r="4"
    stroke="url(#lensGradient)"
    stroke-width="1"
    fill="none"
    opacity="0.8"
  />

  <circle cx="20" cy="21" r="1.6" fill="#ffffff" filter="url(#logoGlow)" />

  <path
    d="M 15.5 18 A 6 6 0 0 1 20 15"
    stroke="#ffffff"
    stroke-width="1"
    stroke-linecap="round"
    fill="none"
    opacity="0.6"
  />
</svg>