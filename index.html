<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Chalachitra</title>

    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Chalachitra — cinematic discovery, refined." />

    <!-- Social -->
    <meta property="og:title" content="Chalachitra" />
    <meta property="og:description" content="Chalachitra — cinematic discovery, refined." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA / Mobile -->
    <meta name="mobile-web-app-capable" content="yes" />        <!-- Android -->
    <meta name="apple-mobile-web-app-capable" content="yes" />  <!-- iOS -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a0b" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- iOS does NOT render SVG touch icons — use a 180x180 PNG -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Optional but recommended for a proper Android PWA install -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-[#0a0a0b] text-[#f5f5f7] antialiased overflow-x-hidden selection:bg-white/20 selection:text-[#f5f5f7]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
